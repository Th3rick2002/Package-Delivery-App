services:
  postgres:
    image: postgres:17-alpine
    container_name: smallbox-db
    ports:
      - '0.0.0.0:5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=smallbox_db
    restart: on-failure
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smallbox-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--requirepass redis1234 --appendonly yes
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
